name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no Python 3.9
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python files
        run: python -m compileall -q main.py src experiments tests

      - name: Run unit tests (no requests are sent to Tiki)
        run: python -m unittest discover -s tests -v
